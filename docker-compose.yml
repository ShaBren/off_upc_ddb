services:
  upc-api:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - upc_data:/data       # persisted parquet file + manifest
      - hf_cache:/hf_cache   # Hugging Face cache (enables resume & delta updates)
    environment:
      - OFF_UPC_DDB_PATH=/data/food.parquet
      - HF_HOME=/hf_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  upc_data:
  hf_cache:
